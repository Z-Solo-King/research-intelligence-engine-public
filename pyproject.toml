[project]
name = "research-intelligence-engine"
version = "0.1.0"
description = "Public-safe research intelligence engine"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "workers-py>=1.9",
  "workers-runtime-sdk",
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
