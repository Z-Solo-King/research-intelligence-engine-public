[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-intelligence-engine"
version = "0.2.0"
description = "Public-safe research intelligence engine"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
include = ["foundation_core*"]

[dependency-groups]
dev = [
  "workers-py>=1.9",
  "workers-runtime-sdk",
  "pytest",
  "pytest-asyncio",
  "coverage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
